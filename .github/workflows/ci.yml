name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  host:
    name: flake check / go / cli
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: Mic92/niks3-action@12d3e320b2a99b7938f9634bd337cd9fec104609 # v1.1.0
        with:
          server-url: https://niks3.natsukium.com
      - run: nix flake check --print-build-logs
      # `nix flake check` skips sproutConfigurations as an unknown flake
      # output, so instantiating the bundles is what covers nix/bundle.nix here.
      # See dev/check-examples.sh for the same check over the examples.
      - run: nix path-info --derivation .#sproutConfigurations.{aarch64-darwin,aarch64-linux,x86_64-linux}.dev
      - run: ./dev/check-examples.sh
      - run: nix develop -c go vet ./...
      # -race because the network stack and the idle watcher are concurrent.
      - run: nix develop -c go test -race ./...

  linux:
    name: flake check / go (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Only x86_64-linux carries the NixOS test check, and only its
          # runner exposes /dev/kvm.
          - { system: x86_64-linux, runner: ubuntu-24.04, kvm: true }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm, kvm: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action installs a udev rule opening /dev/kvm before installing Nix
      # (its enable_kvm input, on by default). Nix would also detect kvm on
      # its own, but declaring the features makes a missing /dev/kvm fail the
      # test loudly instead of leaving the check unbuildable.
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_conf: ${{ matrix.kvm && 'system-features = nixos-test benchmark big-parallel kvm' || '' }}
      - if: matrix.kvm
        run: test -r /dev/kvm -a -w /dev/kvm
      - uses: Mic92/niks3-action@12d3e320b2a99b7938f9634bd337cd9fec104609 # v1.1.0
        with:
          server-url: https://niks3.natsukium.com
      - run: nix flake check --print-build-logs
      - run: nix develop -c go vet ./...
      - run: nix develop -c go test -race ./...

  e2e-linux:
    name: sproutTests (x86_64-linux, QEMU/KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: Mic92/niks3-action@12d3e320b2a99b7938f9634bd337cd9fec104609 # v1.1.0
        with:
          server-url: https://niks3.natsukium.com
      - name: Make /dev/kvm accessible to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Ubuntu's AppArmor denies unprivileged user namespaces by default, and
      # virtiofsd's rootless sandbox needs one per share.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: nix run .#sprout -- doctor
      - run: nix run .#sproutTests.all

  guests:
    name: guest closure (${{ matrix.host }}, ${{ matrix.example }}/${{ matrix.vm }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: aarch64-darwin, runner: ubuntu-24.04-arm, example: minimal, vm: dev }
          - { host: aarch64-darwin, runner: ubuntu-24.04-arm, example: podman, vm: todo }
          - { host: aarch64-darwin, runner: ubuntu-24.04-arm, example: k3s, vm: todo }
          - { host: aarch64-linux, runner: ubuntu-24.04-arm, example: minimal, vm: dev }
          - { host: x86_64-linux, runner: ubuntu-24.04, example: minimal, vm: dev }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - uses: Mic92/niks3-action@12d3e320b2a99b7938f9634bd337cd9fec104609 # v1.1.0
        with:
          server-url: https://niks3.natsukium.com
      # Only the guest closure is built here, not the bundle around it: the
      # bundle is a two-file runCommand whose substitution value is nil (users
      # build their own project's bundle, not an example's), while this closure
      # is the base system every guest shares.
      - run: nix build ./examples/${{ matrix.example }}#nixosConfigurations.sprout-${{ matrix.host }}-${{ matrix.vm }}.config.system.build.toplevel --print-build-logs
